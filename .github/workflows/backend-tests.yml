name: Backend tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # PaymentRefundTests needs a real relational database - PaymentService.HandleWebhookAsync
    # opens an explicit transaction and takes a row lock via ExecuteSqlRawAsync("... FOR UPDATE"),
    # neither of which the InMemory provider (used by every other test) can emulate. Credentials
    # match this repo's own local-dev convention (appsettings.Development.json), consumed via
    # TEST_MYSQL_CONNECTION_STRING below - not a secret, just a throwaway CI-only database.
    # RedisInfrastructureTests needs a real Redis - it proves cross-replica correctness (CTO audit
    # Etap 4) by pointing two independent client instances at the same Redis and checking they see
    # each other's writes, which nothing in-process can honestly stand in for.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: carswebsite
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      TEST_MYSQL_CONNECTION_STRING: "Server=127.0.0.1;Database=cars_website_test;User=root;Password=carswebsite;Port=3306;"
      TEST_REDIS_CONNECTION_STRING: "localhost:6379"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore cars-website-api.sln

      - name: Build
        run: dotnet build cars-website-api.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test CarsWebsite.Tests/CarsWebsite.Tests.csproj --no-build --configuration Release --logger "console;verbosity=normal"
